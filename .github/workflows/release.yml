name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - run: rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
      - name: Install aarch64 linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build linux amd64
        run: cargo build --release -p mikrotik-tui --target x86_64-unknown-linux-gnu
      - name: Build linux arm64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p mikrotik-tui --target aarch64-unknown-linux-gnu
      - name: Package artifacts
        run: |
          mkdir -p dist
          tar -C target/x86_64-unknown-linux-gnu/release -czf dist/mikrotik-tui-linux-amd64.tar.gz mikrotik-tui
          tar -C target/aarch64-unknown-linux-gnu/release -czf dist/mikrotik-tui-linux-arm64.tar.gz mikrotik-tui
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build macos arm64
        run: cargo build --release -p mikrotik-tui --target aarch64-apple-darwin
      - name: Build macos amd64
        run: cargo build --release -p mikrotik-tui --target x86_64-apple-darwin
      - name: Package artifacts
        run: |
          mkdir -p dist
          tar -C target/aarch64-apple-darwin/release -czf dist/mikrotik-tui-macos-arm64.tar.gz mikrotik-tui
          tar -C target/x86_64-apple-darwin/release -czf dist/mikrotik-tui-macos-amd64.tar.gz mikrotik-tui
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - run: rustup target add x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build windows amd64
        run: cargo build --release -p mikrotik-tui --target x86_64-pc-windows-msvc
      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Force `
            -Path target/x86_64-pc-windows-msvc/release/mikrotik-tui.exe `
            -DestinationPath dist/mikrotik-tui-windows-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: (cd dist && sha256sum * > checksums.txt)
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/mikrotik-tui-linux-amd64.tar.gz
            dist/mikrotik-tui-linux-arm64.tar.gz
            dist/mikrotik-tui-macos-arm64.tar.gz
            dist/mikrotik-tui-macos-amd64.tar.gz
            dist/mikrotik-tui-windows-amd64.zip
            dist/checksums.txt
      - name: Notify Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN unset; tap will pick up the release on its hourly bump workflow"
            exit 0
          fi
          gh api --method POST repos/hafuta/homebrew-mikrotik-tui/dispatches \
            -f event_type=mikrotik-tui-release
