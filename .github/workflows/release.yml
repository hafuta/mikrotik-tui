name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - run: rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
      - name: Install aarch64 linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build linux amd64
        run: cargo build --release -p mikrotik-tui --target x86_64-unknown-linux-gnu
      - name: Build linux arm64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p mikrotik-tui --target aarch64-unknown-linux-gnu
      - name: Package artifacts
        run: |
          mkdir -p dist
          tar -C target/x86_64-unknown-linux-gnu/release -czf dist/mikrotik-tui-linux-amd64.tar.gz mikrotik-tui
          tar -C target/aarch64-unknown-linux-gnu/release -czf dist/mikrotik-tui-linux-arm64.tar.gz mikrotik-tui
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mikrotik-tui-linux-amd64.tar.gz
            dist/mikrotik-tui-linux-arm64.tar.gz
            dist/checksums.txt
