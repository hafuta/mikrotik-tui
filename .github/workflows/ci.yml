name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: gofmt -w . && git diff --exit-code
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: GOOS=linux GOARCH=amd64 go build ./cmd/mikrotik-tui
      - run: GOOS=linux GOARCH=arm64 go build ./cmd/mikrotik-tui
      - run: GOOS=darwin GOARCH=amd64 go build ./cmd/mikrotik-tui
      - run: GOOS=darwin GOARCH=arm64 go build ./cmd/mikrotik-tui
      - run: GOOS=windows GOARCH=amd64 go build ./cmd/mikrotik-tui
      - run: GOOS=windows GOARCH=arm64 go build ./cmd/mikrotik-tui
      - run: docker build --build-arg VERSION=ci .
